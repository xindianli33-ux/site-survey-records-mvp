<script>
(() => {
  const DB_NAME = 'site-survey-offline-v1';
  const STORE_NAME = 'pendingPhotos';
  const state = { db: null, syncing: false, records: [], memoryDrafts:new Map() };
  const $ = (id) => document.getElementById(id);

  window.addEventListener('load', init);
  window.addEventListener('online', () => { updateConnection(); syncQueue(); });
  window.addEventListener('offline', updateConnection);

  async function init() {
    setDate();
    bindEvents();
    updateConnection();
    try {
      state.db = await openDatabase();
      await renderQueue();
    } catch (error) {
      showNotice('此瀏覽器無法使用離線暫存；有網路時仍可直接上傳', true);
    }
    loadAppInfo();
    loadRecords();
    if (navigator.onLine) syncQueue();
  }

  function bindEvents() {
    $('libraryButton').onclick = () => $('libraryInput').click();
    $('bottomCamera').onclick = () => $('cameraInput').click();
    $('syncButton').onclick = syncQueue;
    $('bottomSync').onclick = syncQueue;
    $('refreshButton').onclick = loadRecords;
    $('cameraInput').onchange = (event) => queueFiles(event.target.files, event.target);
    $('libraryInput').onchange = (event) => queueFiles(event.target.files, event.target);
  }

  function setDate() {
    const now = new Date();
    $('dateDay').textContent = String(now.getDate());
    $('dateMonth').textContent = `${now.getMonth() + 1}月・${now.getFullYear()}`;
    $('dateTitle').textContent = new Intl.DateTimeFormat('zh-TW', { year:'numeric', month:'long', day:'numeric' }).format(now);
  }

  function updateConnection() {
    const node = $('connectionStatus');
    node.textContent = navigator.onLine ? '● 網路正常' : '○ 離線暫存';
    node.className = `connection ${navigator.onLine ? 'online' : 'offline'}`;
  }

  function loadAppInfo() {
    google.script.run.withSuccessHandler((info) => {
      $('accountName').textContent = info.userEmail || 'Google 帳號';
    }).withFailureHandler((error) => showNotice(error.message, true)).getAppInfo();
  }

  function loadRecords() {
    $('recordList').replaceChildren(makeNode('p', 'empty', '正在讀取 Google Sheet…'));
    google.script.run.withSuccessHandler((records) => {
      state.records = records || [];
      renderRecords();
    }).withFailureHandler((error) => {
      $('recordList').replaceChildren(makeNode('p', 'empty', '目前無法讀取雲端紀錄'));
      showNotice(error.message, true);
    }).getRecentRecords(30);
  }

  async function queueFiles(fileList, input) {
    const files = Array.from(fileList || []);
    input.value = '';
    if (!files.length) return;
    let saved = 0;
    for (const file of files) {
      if (file.type && !file.type.startsWith('image/')) continue;
      if (file.size > 40 * 1024 * 1024) {
        showNotice(`${file.name || '照片'} 超過 40 MB，未加入`, true);
        continue;
      }
      showNotice('已取得照片，請輸入文字說明');
      const details = await requestPhotoDetails(file);
      if (!details) continue;
      const uploadFile = await compressImage(file);
      const clientId = `${Date.now()}-${crypto.randomUUID()}`;
      await putDraft({
        clientId, file:uploadFile, fileName:normalizedUploadName(file.name), mimeType:uploadFile.type || 'image/jpeg',
        description:details.description,
        latitude:details.location?.latitude ?? null,
        longitude:details.location?.longitude ?? null,
        coordinateSource:details.source,
        capturedAt:new Date().toISOString(), status:'queued', error:'',
      });
      saved += 1;
    }
    if (!saved) return;
    showNotice(`已保存 ${saved} 張照片到手機，準備同步`);
    await renderQueue();
    if (navigator.onLine) syncQueue();
  }

  function requestPhotoDetails(file) {
    return new Promise((resolve) => {
      const dialog = $('photoDialog');
      const form = $('photoForm');
      const previewUrl = URL.createObjectURL(file);
      $('photoPreview').src = previewUrl;
      $('photoDescription').value = '';
      $('coordinateResult').textContent = '正在背景讀取照片座標…';
      const coordinatePromise = resolvePhotoLocation(file).then((result) => {
        $('coordinateResult').textContent = result.location
          ? `${result.source === 'EXIF' ? '照片內建座標' : '手機目前座標'}：${result.location.latitude.toFixed(6)}, ${result.location.longitude.toFixed(6)}`
          : '照片沒有座標，且未取得手機位置';
        return result;
      });
      const finish = (value) => {
        URL.revokeObjectURL(previewUrl);
        form.onsubmit = null;
        $('cancelPhoto').onclick = null;
        if (typeof dialog.close === 'function' && dialog.open) dialog.close();
        else dialog.removeAttribute('open');
        resolve(value);
      };
      form.onsubmit = async (event) => {
        event.preventDefault();
        const value = $('photoDescription').value.trim();
        if (!value) return showNotice('請先輸入照片說明', true);
        const coordinates = await coordinatePromise;
        finish({ description:value, ...coordinates });
      };
      $('cancelPhoto').onclick = () => finish(null);
      if (typeof dialog.showModal === 'function') dialog.showModal();
      else dialog.setAttribute('open', '');
      $('photoDescription').focus();
    });
  }

  async function resolvePhotoLocation(file) {
    const exifPosition = await readExifGps(file).catch(() => null);
    if (exifPosition) return { location:exifPosition, source:'EXIF' };
    const devicePosition = $('gpsEnabled').checked ? await getPosition() : null;
    return devicePosition ? {
      location:{ latitude:devicePosition.coords.latitude, longitude:devicePosition.coords.longitude },
      source:'DEVICE',
    } : { location:null, source:'NONE' };
  }

  function normalizedUploadName(name) {
    return `${String(name || 'survey-photo').replace(/\.[^.]+$/, '')}.jpg`;
  }

  async function compressImage(file) {
    const bitmap = await createImageBitmap(file);
    const maxSide = 2200;
    const ratio = Math.min(1, maxSide / Math.max(bitmap.width, bitmap.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(bitmap.width * ratio));
    canvas.height = Math.max(1, Math.round(bitmap.height * ratio));
    canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    bitmap.close?.();
    return new Promise((resolve, reject) => canvas.toBlob(
      (blob) => blob ? resolve(blob) : reject(new Error('照片壓縮失敗')),
      'image/jpeg', 0.84,
    ));
  }

  async function readExifGps(file) {
    if (!/jpe?g/i.test(file.type) && !/\.jpe?g$/i.test(file.name)) return null;
    const view = new DataView(await file.arrayBuffer());
    if (view.byteLength < 4 || view.getUint16(0) !== 0xffd8) return null;
    let offset = 2;
    while (offset + 4 < view.byteLength) {
      if (view.getUint8(offset) !== 0xff) break;
      const marker = view.getUint8(offset + 1);
      const length = view.getUint16(offset + 2);
      if (marker === 0xe1 && length >= 10 && view.getUint32(offset + 4) === 0x45786966) {
        return parseExifGps(view, offset + 10);
      }
      offset += 2 + length;
    }
    return null;
  }

  function parseExifGps(view, tiff) {
    const little = view.getUint16(tiff) === 0x4949;
    const u16 = (at) => view.getUint16(at, little);
    const u32 = (at) => view.getUint32(at, little);
    const readEntries = (start) => {
      const result = new Map();
      const count = u16(start);
      for (let i = 0; i < count; i += 1) {
        const at = start + 2 + i * 12;
        result.set(u16(at), { type:u16(at + 2), count:u32(at + 4), valueAt:at + 8, value:u32(at + 8) });
      }
      return result;
    };
    const ifd0 = readEntries(tiff + u32(tiff + 4));
    const gpsPointer = ifd0.get(0x8825);
    if (!gpsPointer) return null;
    const gps = readEntries(tiff + gpsPointer.value);
    const ascii = (tag) => {
      const item = gps.get(tag); if (!item) return '';
      const at = item.count <= 4 ? item.valueAt : tiff + item.value;
      return String.fromCharCode(view.getUint8(at));
    };
    const degrees = (tag) => {
      const item = gps.get(tag); if (!item || item.type !== 5 || item.count < 3) return null;
      const at = tiff + item.value;
      const part = (index) => u32(at + index * 8) / u32(at + index * 8 + 4);
      return part(0) + part(1) / 60 + part(2) / 3600;
    };
    let latitude = degrees(0x0002);
    let longitude = degrees(0x0004);
    if (latitude == null || longitude == null) return null;
    if (ascii(0x0001) === 'S') latitude *= -1;
    if (ascii(0x0003) === 'W') longitude *= -1;
    return { latitude, longitude };
  }

  function getPosition() {
    return new Promise((resolve) => {
      if (!navigator.geolocation) return resolve(null);
      navigator.geolocation.getCurrentPosition(resolve, () => resolve(null), { enableHighAccuracy:true, timeout:10000, maximumAge:30000 });
    });
  }

  async function syncQueue() {
    if (state.syncing || !navigator.onLine) return;
    const drafts = await getDrafts();
    if (!drafts.length) return;
    state.syncing = true;
    showNotice(`正在同步 ${drafts.length} 筆資料…`);
    for (const draft of drafts) {
      try {
        draft.status = 'syncing'; draft.error = '';
        await putDraft(draft); await renderQueue();
        const base64 = await fileToBase64(draft.file);
        await callServer('saveSurveyPhoto', { ...draft, file:undefined, base64 });
        await deleteDraft(draft.clientId);
      } catch (error) {
        draft.status = 'queued'; draft.error = error.message || '同步失敗';
        await putDraft(draft);
        if (!navigator.onLine) break;
      }
    }
    state.syncing = false;
    await renderQueue();
    const remaining = await getDrafts();
    showNotice(remaining.length ? `仍有 ${remaining.length} 筆等待同步` : '全部資料已同步至 Google Drive 與 Sheet', remaining.length > 0);
    loadRecords();
  }

  function callServer(method, payload) {
    return new Promise((resolve, reject) => google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[method](payload));
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result).split(',')[1]);
      reader.onerror = () => reject(new Error('無法讀取照片'));
      reader.readAsDataURL(file);
    });
  }

  async function renderQueue() {
    const drafts = await getDrafts();
    $('queueCount').textContent = String(drafts.length);
    $('queueSection').hidden = drafts.length === 0;
    const list = $('queueList'); list.replaceChildren();
    drafts.forEach((draft) => {
      const row = makeNode('div', 'queue-row');
      const image = makeNode('img', 'queue-thumb'); image.src = URL.createObjectURL(draft.file); image.alt = '';
      const copy = makeNode('div', 'queue-copy');
      copy.append(makeNode('b', '', draft.description), makeNode('small', '', draft.status === 'syncing' ? '同步中…' : draft.error || '等待網路同步'));
      const remove = makeNode('button', '', '移除');
      remove.onclick = async () => { await deleteDraft(draft.clientId); renderQueue(); };
      row.append(image, copy, remove); list.append(row);
    });
  }

  function renderRecords() {
    const list = $('recordList'); list.replaceChildren();
    if (!state.records.length) return list.append(makeNode('p', 'empty', '目前還沒有雲端現勘照片'));
    state.records.forEach((record) => {
      const card = makeNode('a', 'photo-card');
      card.href = record.driveUrl; card.target = '_blank'; card.rel = 'noopener';
      card.append(makeNode('b', '', record.description || record.fileName || '現勘照片'));
      const gpsText = record.latitude != null ? `${Number(record.latitude).toFixed(6)}, ${Number(record.longitude).toFixed(6)}` : '無座標';
      card.append(makeNode('small', record.latitude != null ? 'gps' : '', gpsText));
      list.append(card);
    });
  }

  function showNotice(message, isError = false) {
    const node = $('notice'); node.hidden = false; node.textContent = message; node.className = `notice${isError ? ' error' : ''}`;
  }

  function makeNode(tag, className = '', text = '') {
    const node = document.createElement(tag); node.className = className; if (text) node.textContent = text; return node;
  }

  function openDatabase() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, 1);
      request.onupgradeneeded = () => request.result.createObjectStore(STORE_NAME, { keyPath:'clientId' });
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  function transact(mode, action) {
    return new Promise((resolve, reject) => {
      const tx = state.db.transaction(STORE_NAME, mode); const store = tx.objectStore(STORE_NAME); const request = action(store);
      request.onsuccess = () => resolve(request.result); request.onerror = () => reject(request.error);
    });
  }
  const putDraft = (draft) => {
    if (state.db) return transact('readwrite', (store) => store.put(draft));
    state.memoryDrafts.set(draft.clientId, draft); return Promise.resolve(draft.clientId);
  };
  const getDrafts = () => state.db
    ? transact('readonly', (store) => store.getAll())
    : Promise.resolve(Array.from(state.memoryDrafts.values()));
  const deleteDraft = (id) => {
    if (state.db) return transact('readwrite', (store) => store.delete(id));
    state.memoryDrafts.delete(id); return Promise.resolve();
  };
})();
</script>
