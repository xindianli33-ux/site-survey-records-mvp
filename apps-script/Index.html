<!DOCTYPE html><html lang="zh-Hant"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075b32">
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script><script src="https://cdn.jsdelivr.net/npm/exifreader@4.43.0/dist/exif-reader.js"></script><?!= include('Stylesheet'); ?></head><body>
<main class="app-shell"><header class="topbar"><button id="backButton" class="icon-button" hidden>←</button><img class="app-icon" src="https://xindianli33-ux.github.io/site-survey-records-mvp/icon.png" alt=""><div class="brand"><small>FIELD SURVEY</small><h1>現場勘查工具</h1></div><span id="connectionStatus" class="connection">連線中</span></header><div id="notice" class="notice" role="status" hidden></div>
<section id="taskView" class="page"><div class="hero"><p>每個任務會建立獨立的 Google Drive 資料夾、Sheet 與照片紀錄。</p><button id="showCreateTask" class="primary">＋ 建立新任務</button></div><div class="section-title"><div><small>任務列表</small><h2>選擇現勘任務</h2></div><button id="refreshTasks" class="text-button">重新整理</button></div><div id="taskList" class="task-list"><p class="empty">正在讀取任務…</p></div></section>
<section id="workspaceView" class="page" hidden><div class="task-banner"><small>目前任務</small><h2 id="currentTaskName"></h2><p id="currentTaskMeta"></p></div><nav class="tabs"><button class="active" data-tab="upload">新增資料</button><button data-tab="browse">資料瀏覽</button></nav>
<section id="uploadPanel" class="panel"><div class="upload-card"><div class="upload-symbol">▧</div><h2>選取手機中的照片</h2><p>從原始照片讀取拍攝日期、時間與 EXIF 座標，不使用手機目前位置。</p><label class="primary file-button">選取照片<input id="photoInput" type="file" accept="image/jpeg,image/png,image/heic,image/heif,.jpg,.jpeg,.png,.heic,.heif"></label><small>支援 JPG、PNG、HEIC、HEIF，單張上限 15 MB</small></div></section>
<section id="browsePanel" class="panel" hidden><input id="keywordFilter" class="search-input" type="search" placeholder="搜尋概要或照片說明"><details class="filters-box"><summary>篩選與排序</summary><div class="filters"><div class="filter-row"><input id="dateFrom" type="date"><input id="dateTo" type="date"></div><div class="filter-row"><select id="coordinateFilter"><option value="all">全部座標</option><option value="yes">有座標</option><option value="no">無座標</option></select><select id="sortOrder"><option value="newest">最新優先</option><option value="oldest">最舊優先</option></select></div></div></details><div class="browse-toolbar"><span id="recordCount">0 筆資料</span><div class="view-switch"><button id="cardViewButton" class="active">卡片</button><button id="tableViewButton">表格</button></div></div><div id="recordList" class="record-cards"><p class="empty">正在讀取資料…</p></div></section></section><label id="bottomUpload" class="bottom-upload" for="photoInput" hidden>＋ 選取照片</label></main>
<dialog id="createTaskDialog" class="dialog"><form id="createTaskForm"><div class="dialog-heading"><div><small>NEW TASK</small><h2>建立新任務</h2></div><button id="cancelCreateTask" class="icon-button" type="button">×</button></div><label>任務名稱<input id="taskName" maxlength="60" required placeholder="例如：溪岸護坡現勘"></label><label>任務日期<input id="taskDate" type="date" required></label><button class="primary wide">建立資料夾與 Sheet</button></form></dialog>
<dialog id="photoDialog" class="dialog photo-dialog"><form id="photoForm"><div class="dialog-heading"><div><small>PHOTO DETAILS</small><h2>確認照片資料</h2></div><button id="cancelPhoto" class="icon-button" type="button">×</button></div><img id="photoPreview" alt="選取照片預覽"><div class="metadata-grid"><div><small>日期</small><b id="metaDate">—</b></div><div><small>時間</small><b id="metaTime">—</b></div><div><small>緯度</small><b id="metaLatitude">—</b></div><div><small>經度</small><b id="metaLongitude">—</b></div><div><small>誤差範圍（公尺）</small><b id="metaAccuracy">0</b></div></div><p id="exifStatus" class="status-line"></p><label>概要（選填）<input id="summary" maxlength="80" placeholder="例如：工區起點"></label><label>照片說明（選填）<textarea id="description" maxlength="500" rows="3" placeholder="補充現場狀況"></textarea></label><button id="savePhoto" class="primary wide">保存並上傳</button></form></dialog><div id="uploadOverlay" class="upload-overlay" hidden><div class="spinner"></div><b id="uploadStatus">正在處理照片…</b><small>請保持頁面開啟</small></div><?!= include('JavaScript'); ?></body></html>
